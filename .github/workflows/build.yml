name: Build exe 

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install openpyxl keyboard pyperclip pyinstaller

      - name: Build exe
        run: python -m PyInstaller --onefile --noconsole --name TabelaPaster tabela_paster.py

      - uses: actions/upload-artifact@v4
        with:
          name: TabelaPaster
          path: dist/TabelaPaster.exe
